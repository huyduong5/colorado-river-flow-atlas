# Cấu hình LightGBM direct 7; các khóa chính cũng nằm trong default.yaml.
lightgbm:
  target_mode: "delta"
  num_boost_round: 1000
  early_stopping_rounds: 50
  n_jobs: 4
  trials: 8
  base_params:
    objective: "regression"
    metric: "rmse"
    learning_rate: 0.03
    num_leaves: 15
    max_depth: 5
    min_child_samples: 30
    reg_lambda: 1.0
    verbosity: -1
    seed: 42
    deterministic: true
    force_col_wise: true
  search_space:
    learning_rate: [0.03, 0.05]
    num_leaves: [7, 15, 31]
    max_depth: [3, 5, -1]
    min_child_samples: [20, 40, 80]
    reg_lambda: [0.0, 1.0, 5.0]
